# Packets one NET_RX softirq round may process before it yields. At the
# default 300 a C-360 under two-radio load ran out of budget (time_squeeze)
# about 5000 times per test set; at 600 about 370 times, with 5-9% more
# throughput and a third lower ping p95 for the loaded client (2026-11-07).
# netdev_budget_usecs stays at its default, 2 jiffies (20 ms at HZ=100).
net.core.netdev_budget=600
